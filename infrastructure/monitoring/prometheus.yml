global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: solvenow

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add your Alertmanager endpoint here

scrape_configs:
  # SolveNow API metrics
  - job_name: solvenow-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis metrics (via redis_exporter)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Node/host metrics (via node_exporter)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

